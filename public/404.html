<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Ambil path URL (misal: /profil)
      var path = window.location.pathname;
      
      // Pindahkan user ke halaman utama react dengan path yang sama
      // Ganti 'Ngajirumi' persis dengan nama repo kamu
      window.location.replace('/Ngajirumi' + path);
    </script>
  </head>
  <body>
    <p>Memuat halaman... Mohon tunggu.</p>
  </body>
</html>
